name: supernote-private-cloud

services:
  mariadb:
    image: mariadb:10.6.24
    restart: unless-stopped
    env_file:
      - .dbenv
    environment:
      TZ: ${TZ:-UTC}
    command: --skip-name-resolve --bind-address=0.0.0.0
    volumes:
      - ./sndata/db_data:/var/lib/mysql
      - ./sndata/config/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./supernotedb.sql:/docker-entrypoint-initdb.d/01-supernotedb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4.7
    restart: unless-stopped
    env_file:
      - .dbenv
    environment:
      TZ: ${TZ:-UTC}
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - ./sndata/redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12

  notelib:
    image: docker.io/supernote/notelib:6.9.3
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}

  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    env_file:
      - .dbenv
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_TLS_CERT: /cert/mailpit.crt
      MP_SMTP_TLS_KEY: /cert/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - ./sndata/mailpit/data:/data
      - ./sndata/mailpit/cert:/cert:ro
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12

  supernote-service:
    build:
      context: .
      dockerfile: Dockerfile.mail
    image: local/supernote-service:26.06.04-mailpit
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - .dbenv
    environment:
      DB_HOSTNAME: mariadb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EXTERNAL_PORT_BACKEND: 19071
      EXTERNAL_PORT_FRONTEND: ${SUPERNOTE_HTTP_PORT:-19072}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${SUPERNOTE_HTTP_PORT:-19072}:8080"
    volumes:
      - ./sndata/recycle:/home/supernote/recycle
      - ./supernote_data:/home/supernote/data
      - ./sndata/logs/cloud:/home/supernote/cloud/logs
      - ./sndata/logs/app:/home/supernote/logs
      - ./sndata/logs/web:/var/log/nginx
      - ./sndata/convert:/home/supernote/convert
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  funnel-proxy:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    depends_on:
      - supernote-service
    ports:
      - "127.0.0.1:${SUPERNOTE_FUNNEL_PROXY_PORT:-19073}:8080"
    volumes:
      - ./funnel-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12

  obsidian-copy:
    image: bash:5.2.37-alpine3.22
    profiles: ["copy"]
    restart: unless-stopped
    depends_on:
      - supernote-service
    environment:
      SUPERNOTE_NOTE_DIR: /supernote-notes
      OBSIDIAN_VAULT_DIR: /obsidian-vault
      SUPERNOTE_COPY_INTERVAL: ${SUPERNOTE_COPY_INTERVAL:-300}
    volumes:
      - ${SUPERNOTE_NOTE_DIR:?set SUPERNOTE_NOTE_DIR in supernote/.env}:/supernote-notes:ro
      - ${OBSIDIAN_VAULT_DIR:?set OBSIDIAN_VAULT_DIR in supernote/.env}:/obsidian-vault
      - ../scripts/sync-supernote.sh:/app/sync-supernote.sh:ro
    command:
      - /usr/local/bin/bash
      - -c
      - |
        while true; do
          /usr/local/bin/bash /app/sync-supernote.sh
          sleep "$${SUPERNOTE_COPY_INTERVAL}"
        done

  supernote-upload:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: local/supernote-bridge
    profiles: ["copy"]
    restart: unless-stopped
    depends_on:
      - supernote-service
    env_file:
      - path: .uploadenv
        required: false
    environment:
      SUPERNOTE_API_BASE: http://supernote-service:8080/api
      OBSIDIAN_VAULT_DIR: /obsidian-vault
      SUPERNOTE_STATE_PATH: /state/remote-files.json
    volumes:
      - ${OBSIDIAN_VAULT_DIR:?set OBSIDIAN_VAULT_DIR in supernote/.env}:/obsidian-vault
      - ./sndata/bridge:/state
      - ../scripts/sync-obsidian-to-supernote.py:/app/sync-obsidian-to-supernote.py:ro
      - ./markdown.css:/app/markdown.css:ro
    command:
      - python
      - /app/sync-obsidian-to-supernote.py
      - --loop
      - ${SUPERNOTE_COPY_INTERVAL:-300}
