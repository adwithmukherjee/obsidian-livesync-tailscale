name: obsidian-livesync

services:
  couchdb:
    build:
      context: .
    image: local/obsidian-livesync-couchdb:3.5.0
    container_name: obsidian-livesync-couchdb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Set COUCHDB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${COUCHDB_PORT:-5984}:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}" http://127.0.0.1:5984/_up >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  couchdb-init:
    image: local/obsidian-livesync-couchdb:3.5.0
    pull_policy: never
    container_name: obsidian-livesync-init
    restart: "no"
    env_file:
      - .env
    environment:
      COUCHDB_INTERNAL_URL: http://couchdb:5984
    depends_on:
      couchdb:
        condition: service_healthy
    volumes:
      - ./scripts/init-couchdb.sh:/usr/local/bin/init-couchdb.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/init-couchdb.sh

volumes:
  couchdb-data:
    driver: local
